<h1>Books</h1>
<ul>
  {% for book in books %}
    <li><a href="/book/{{ book.id }}">{{ book.title }}</a></li>
  {% endfor %}
</ul>

<div>
  {% if has_prev %}
    <a href="/books?page={{ page - 1 }}">← Назад</a>
  {% endif %}
  {% if has_next %}
    <a href="/books?page={{ page + 1 }}">Вперед →</a>
  {% endif %}
  <p><a href="/books/new">Добавить книгу</a></p>
</div>
