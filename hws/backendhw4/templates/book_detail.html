<h1>{{ book.title }}</h1>
<p><strong>Автор:</strong> {{ book.author }}</p>
<p><strong>Год:</strong> {{ book.year }}</p>
<p><strong>Страниц:</strong> {{ book.total_pages }}</p>
<p><strong>Жанр:</strong> {{ book.genre }}</p>

<form action="/book/{{ book.id }}/delete" method="post">
  <button type="submit">Удалить книгу</button>
</form>

<p><a href="/books">← Назад к списку</a></p>
<p><a href="/book/{{ book.id }}/edit">редактировать</a></p>
